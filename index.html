<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Projetos de Ramson — página inicial de ramson.com.br">
    <title>Ramson — Projetos</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #f5f7fb;
        --surface: #ffffff;
        --text: #172033;
        --muted: #667085;
        --accent: #3157d5;
        --border: #e4e7ec;
        --shadow: 0 18px 50px rgba(23, 32, 51, 0.1);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0f1420;
          --surface: #171e2d;
          --text: #f2f4f7;
          --muted: #aab2c0;
          --accent: #8da6ff;
          --border: #2a3447;
          --shadow: 0 18px 50px rgba(0, 0, 0, 0.3);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--background);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 680px);
      }

      header {
        margin-bottom: 28px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2.2rem, 8vw, 4.5rem);
        line-height: 1;
        letter-spacing: -0.05em;
      }

      header p {
        margin: 0;
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.6;
      }

      .projects-title {
        margin: 0 0 12px;
        font-size: 0.85rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .project {
        display: block;
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--surface);
        box-shadow: var(--shadow);
        color: inherit;
        text-decoration: none;
        transition: transform 160ms ease, border-color 160ms ease;
      }

      .project:hover,
      .project:focus-visible {
        transform: translateY(-3px);
        border-color: var(--accent);
      }

      .project:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 4px;
      }

      .project h2 {
        margin: 0 0 8px;
        font-size: 1.45rem;
      }

      .project p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .arrow {
        display: inline-block;
        margin-top: 18px;
        color: var(--accent);
        font-weight: 700;
      }

      footer {
        margin-top: 28px;
        color: var(--muted);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Ramson</h1>
        <p>Um espaço para reunir projetos, estudos e experimentos.</p>
      </header>

      <section aria-labelledby="projetos">
        <h2 class="projects-title" id="projetos">Projetos</h2>
        <a class="project" href="/estudaai/">
          <h2>EstudaAI</h2>
          <p>Acesse o projeto EstudaAI.</p>
          <span class="arrow" aria-hidden="true">Conhecer o projeto →</span>
        </a>
      </section>

      <footer>ramson.com.br</footer>
    </main>
  </body>
</html>
